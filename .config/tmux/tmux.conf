# tmux 3.8 enables mouse support by default.
set -g base-index 1
set -g history-limit 50000
set -g copy-mode-position-format ''
set -g automatic-rename off
set -g focus-events on
# Let Codex's tmux-wrapped OSC 9 notifications reach Ghostty.
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -s set-clipboard on
set -s extended-keys on
set -s extended-keys-format csi-u

# Plain tmux creates or reattaches to the workspace.
set -s default-client-command { new-session -A -s dev -n ' Codex' 'codex; exec bash' }
set-hook -g session-created {
  if -F '#{==:#{hook_session_name},dev}' {
    new-window -d -t dev:2 -c '#{session_path}' -n ' Lazygit' 'lazygit; exec bash'
    new-window -d -t dev:3 -c '#{session_path}' -n ' Neovim' 'nvim; exec bash'
    new-window -d -t dev:4 -c '#{session_path}' -n ' Bash'
  }
}

# Preserve Ghostty Cmd+B / Neovim Ctrl+B.
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4

# Keep application mouse routing; scroll tmux history one line per wheel event.
bind -T copy-mode WheelUpPane { select-pane; send-keys -X -N 1 scroll-up }
bind -T copy-mode WheelDownPane { select-pane; send-keys -X -N 1 scroll-down }
bind -T copy-mode-vi WheelUpPane { select-pane; send-keys -X -N 1 scroll-up }
bind -T copy-mode-vi WheelDownPane { select-pane; send-keys -X -N 1 scroll-down }

# Follow Ghostty's light/dark Gruvbox palette.
set -g status-style 'bg=default,fg=default'
set -g status-interval 5
set -g status-left-length 80
set -g status-left '#[bg=colour4,fg=colour0,bold]  #{b:pane_current_path} '
set -ag status-left '#[fg=colour4,bg=colour2,nobold]#[fg=colour0,bold]  '
set -ag status-left '#(git -C #{q:pane_current_path} branch --show-current 2>/dev/null) '
set -ag status-left '#[fg=colour2,bg=default,nobold]#[default] '
set -g window-status-style 'fg=colour4'
set -g window-status-format ' #I #W '
set -g window-status-current-style 'none'
set -g window-status-current-format '#[bg=colour5,fg=colour0,bold] #I #W #[default]'
set -g status-right ''
