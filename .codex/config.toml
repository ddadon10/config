model = "gpt-6.1-sol"
model_context_window = 400000
model_auto_compact_token_limit = 360000
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "xhigh"
service_tier = "priority"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
web_search = "indexed"
check_for_update_on_startup = false
suppress_unstable_features_warning = true

[agents]
max_concurrent_threads_per_session = 6

[sandbox_workspace_write]
network_access = true

[features]
runtime_metrics = true
default_mode_request_user_input = true
apply_patch_streaming_events = true

[features.network_proxy]
enabled = true

[features.network_proxy.domains]
# For additional package registry and download domains, see Dependabot's egress allowlist:
# https://github.com/dependabot/proxy/blob/main/internal/handlers/egress_allowlist_defaults.yaml

# GitHub
"github.com" = "allow"
"api.github.com" = "allow"
"codeload.github.com" = "allow"
"raw.githubusercontent.com" = "allow"
"release-assets.githubusercontent.com" = "allow"

# Go modules
"proxy.golang.org" = "allow"
"sum.golang.org" = "allow"

# Npm
"registry.npmjs.org" = "allow"

# Yarn
"registry.yarnpkg.com" = "allow"

# Maven
"repo.maven.apache.org" = "allow"
"repo1.maven.org" = "allow"
"repo.spring.io" = "allow"
"dl.google.com" = "allow"
"maven.google.com" = "allow"

# Gradle
"services.gradle.org" = "allow"
"plugins-artifacts.gradle.org" = "allow"
"repo.gradle.org" = "allow"
"downloads.gradle.org" = "allow"
"plugins.gradle.org" = "allow"

# Localhost
"localhost" = "allow"
"127.0.0.1" = "allow"

[shell_environment_policy]
inherit = "all"

[tui]
show_tooltips = false
notifications = true
notification_method = "osc9"
theme = "gruvbox-dark"
terminal_title = ["spinner", "app-name", "project"]
status_line = ["model-with-reasoning", "context-used", "five-hour-limit", "weekly-limit", "total-input-tokens", "total-output-tokens", "fast-mode"]

[tui.effects]
starfield = false

[tui.keymap.global]
toggle_fast_mode = "alt-s"

[tui.keymap.chat]
increase_reasoning_effort = "alt-a"
decrease_reasoning_effort = "alt-d"

[tui.keymap.editor]
delete_forward_word = []
kill_whole_line = "alt-k"
