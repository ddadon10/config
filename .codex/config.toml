model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
plan_mode_reasoning_effort = "xhigh"
check_for_update_on_startup = false
service_tier = "priority"
suppress_unstable_features_warning = true

[agents]
max_concurrent_threads_per_session = 6

[features]
runtime_metrics = true
default_mode_request_user_input = true
apply_patch_streaming_events = true

[projects."/workspace"]
trust_level = "trusted"

[shell_environment_policy]
inherit = "all"

[tui]
show_tooltips = false
notifications = true
notification_method = "osc9"
theme = "gruvbox-dark"
terminal_title = ["spinner", "app-name"]
status_line = ["model-with-reasoning", "context-used", "five-hour-limit", "weekly-limit", "total-input-tokens", "total-output-tokens", "fast-mode"]

[tui.effects]
starfield = false

[tui.keymap.global]
toggle_fast_mode = "alt-s"

[tui.keymap.chat]
increase_reasoning_effort = "alt-a"
decrease_reasoning_effort = "alt-d"

[tui.keymap.editor]
delete_forward_word = []
kill_whole_line = "alt-k"
